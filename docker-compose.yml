services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cygnus-backend
    ports:
      - "5001:5000"   # Changed host port from 5000 to 5001
    environment:
      - PORT=5000
      # Optional: export ANTHROPIC_API_KEY before `docker-compose up` to let Claude write
      # AI Investigator narratives. Without it the rule-based briefing is used.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Sign-in. Demo mode adds one-click analyst / compliance-officer sign-in for the judges;
      # set CYGNUS_DEMO_MODE=false and the two passwords for a real deployment (see .env.example).
      - CYGNUS_DEMO_MODE=${CYGNUS_DEMO_MODE:-true}
      - CYGNUS_AUTH_SECRET=${CYGNUS_AUTH_SECRET:-}
      - CYGNUS_ANALYST_PASSWORD=${CYGNUS_ANALYST_PASSWORD:-}
      - CYGNUS_ADMIN_PASSWORD=${CYGNUS_ADMIN_PASSWORD:-}
    volumes:
      # Audit log and case files survive container rebuilds
      - cygnus-data:/app/backend/data
    restart: always

  frontend:
    build: ./frontend
    container_name: cygnus-frontend
    ports:
      - "3001:80"     # Changed host port from 3000 to 3001
    depends_on:
      - backend
    restart: always

  graph-engine:
    build:
      context: .
      dockerfile: graph-engine/Dockerfile
    container_name: cygnus-graph-engine
    ports:
      - "8000:8000"
    restart: always

  ml-engine:
    build:
      context: .
      dockerfile: ml/Dockerfile
    container_name: cygnus-ml-engine
    ports:
      - "8001:8001"
    restart: always

volumes:
  cygnus-data:
