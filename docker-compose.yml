services:
  backend:
    build: ./backend
    container_name: flowguard-backend
    ports:
      - "5001:5000"   # Changed host port from 5000 to 5001
    environment:
      - PORT=5000
    restart: always

  frontend:
    build: ./frontend
    container_name: flowguard-frontend
    ports:
      - "3001:80"     # Changed host port from 3000 to 3001
    depends_on:
      - backend
    restart: always

  graph-engine:
    build: ./graph-engine
    container_name: flowguard-graph-engine
    ports:
      - "8000:8000"
    restart: always

  ml-engine:
    build: ./ml
    container_name: flowguard-ml-engine
    ports:
      - "8001:8001"
    restart: always